# Economia: valores pagos em dinheiro.
economia:
  # Recompensa para quem ganha a kill (inclui kill por combat log).
  recompensa-kill: 100
  # Recompensa para cada jogador que ganha assistência.
  recompensa-assistencia: 30

# Clans.
clan:
  # Máximo de membros por clan (incluindo o líder).
  max-membros: 2

# XP: o servidor não tem XP. A barra de XP mostra o recurso da classe (ex: a mana do Mago).
xp:
  # true: nenhuma fonte dá XP nem orbes e o XP real de todos fica em 0 (a barra das classes só funciona assim).
  desativado: true
  # Mesa de encantamento e bigorna ficam bloqueadas até o encantamento novo existir.
  bloquear-mesa-encantamento: true
  bloquear-bigorna: true
  # true: desliga a Locator Bar (barra de pontos/direção no lugar da barra de XP) em todos os mundos. Só existe na 1.21.6+.
  desativar-locator-bar: true

# Combate: comandos que não podem ser usados enquanto o jogador está em combate (sem a barra).
combate:
  comandos-bloqueados:
    - grimorio

# PvP estilo 1.8.
pvp:
  # Tira a recarga de ataque: todo golpe sai com dano cheio, mesmo clicando rápido.
  sem-recarga-de-ataque: true
  # Remove o ataque em área (sweep) da espada.
  remover-ataque-em-area: true
  # Machado com o dano da 1.8 (madeira 3, ouro 3, pedra 4, ferro 5, diamante 6, netherite 7).
  dano-machado-1-8: true
  # Impede de levantar o escudo.
  desativar-escudo: false

# Login (o servidor roda em modo offline).
login:
  # Tempo para fazer login/registro antes de ser expulso.
  tempo-para-logar-segundos: 60
  # Senhas erradas seguidas até ser expulso.
  tentativas-maximas: 5
  # Sessão: quem sai e volta com o MESMO IP dentro do prazo entra já logado.
  sessao:
    ativada: false
    minutos: 10

# Classe Mago (staffs, míssil, mana, passivas e fraqueza).
mago:
  # true: as staffs usam o item_model "mineplug:staff_<tipo>" (resource pack). false: aparência normal.
  textura-personalizada: false
  mana-maxima: 10
  # true: mostra a mana também na sidebar (por padrão ela só aparece na barra de XP).
  mana-na-sidebar: false
  mana:
    # Segundos para recuperar 1 ponto de mana.
    regen-fora-combate: 2
    regen-em-combate: 6
    # Mana ganha ao matar um jogador / ao dar assistência.
    por-kill: 3
    por-assistencia: 1
  # Míssil Arcano (clique esquerdo com a staff): sem mana, sem recarga.
  missil:
    intervalo-segundos: 0.6
    mana-por-acerto: 1
    dano: 2.5
    alcance: 30
    # Blocos por tick.
    velocidade: 2
  # Fração do dano perdida com espada, machado, maça, tridente, lança e flechas de arco/besta (0.6 = 60%).
  penalidade-arma: 0.6
  # Fração a mais de dano que o Mago leva de golpes e projéteis (0.15 = +15%).
  dano-extra-recebido-porcentagem: 0.15
  # Poder Arcano: cada magia (não o míssil) dá 1 acúmulo; cada acúmulo aumenta o dano das magias e do míssil.
  poder-arcano:
    bonus-por-acumulo: 0.1
    maximo: 3
    segundos: 5
  # Escudo de Mana: parte do dano levado é paga com mana.
  escudo-mana:
    porcentagem: 0.2
    # Pontos de dano absorvidos por 1 de mana.
    dano-por-mana: 2
  # Grimório: quantas magias podem ficar equipadas (1 a 9).
  grimorio:
    max-equipadas: 4
  # Combos entre magias. Cada um se liga/desliga com "ativado".
  combos:
    # Quanto tempo o alvo fica marcado pela Staff de Gelo / de Vento.
    gelo-marca-segundos: 5
    vento-marca-segundos: 3
    # Gelo -> Fogo: o Fogo causa mais dano no alvo congelado e tira a lentidão e a fadiga dele.
    choque-termico:
      ativado: true
      multiplicador-dano: 2
    # Gelo -> Raio: se o primeiro alvo está congelado, o raio pula mais vezes e mais longe.
    condutor:
      ativado: true
      saltos: 4
      distancia-salto: 7
    # Vento -> Fogo: alvos empurrados queimam por mais tempo e a explosão do Fogo cresce.
    tempestade-fogo:
      ativado: true
      fogo-segundos: 6
      raio: 4
    # Teleporte -> qualquer magia: a próxima magia dentro do prazo não gasta mana (a recarga continua).
    passo-arcano:
      ativado: true
      segundos: 4
  # dano = antes da Proteção. recarga e durações em segundos, raio/alcance em blocos.
  staffs:
    fogo:
      mana: 2
      recarga: 5
      dano: 4
      raio: 3
      alcance: 30
      fogo-segundos: 3
      cegueira-segundos: 2
    gelo:
      mana: 2
      recarga: 10
      dano: 2
      raio: 2
      alcance: 30
      efeito-segundos: 5
    raio:
      mana: 3
      recarga: 5
      dano: 6
      alcance: 25
      saltos: 2
      distancia-salto: 5
    teleporte:
      mana: 5
      recarga: 30
      alcance: 30
      carga-segundos: 3
      distancia-acompanhantes: 3
      max-acompanhantes: 2
    vento:
      mana: 2
      recarga: 20
      dano: 3
      raio: 5
      forca-horizontal: 1.5
      forca-vertical: 0.5
    # Nuvem de veneno onde o projétil acerta. nivel-veneno 2 = Veneno II, renovado enquanto o alvo está dentro.
    veneno:
      mana: 3
      recarga: 12
      raio: 3
      alcance: 30
      nuvem-segundos: 4
      efeito-segundos: 3
      nivel-veneno: 2
    # Marca o bloco mirado, avisa com um círculo vermelho e então cai. Não quebra blocos nem põe fogo.
    meteoro:
      mana: 6
      recarga: 60
      dano: 10
      raio: 4
      alcance: 30
      aviso-segundos: 1.5
      lentidao-segundos: 3
    # Dano no alvo da mira (sem atravessar parede); o Mago cura cura-porcentagem do dano causado.
    sangue:
      mana: 3
      recarga: 10
      dano: 4
      alcance: 15
      cura-porcentagem: 0.5
    # Puxa para o Mago os inimigos no raio (só os que ele enxerga). forca = velocidade máxima da puxada.
    gravidade:
      mana: 3
      recarga: 15
      dano: 2
      raio: 8
      forca: 1.2
    # Área no bloco mirado: inimigos ficam com Lentidão (nivel-lentidao 4 = Lentidão IV) e sem pular.
    tempo:
      mana: 4
      recarga: 25
      raio: 5
      alcance: 30
      duracao-segundos: 3
      nivel-lentidao: 4
    # Absorção em vida (8 = 4 corações amarelos) por "segundos".
    escudo:
      mana: 4
      recarga: 30
      absorcao: 8
      segundos: 10
    # Clarão no raio: cegueira nos inimigos; jogador inimigo invisível (ou em Ilusão) é revelado e brilha.
    luz:
      mana: 2
      recarga: 20
      raio: 6
      cegueira-segundos: 3
      brilho-segundos: 5
    # Espíritos (Vex). dano = por golpe de cada espírito (conta como dano do Mago). alcance = distância em que
    # procuram inimigos em volta do Mago. maximo = espíritos vivos ao mesmo tempo por Mago.
    invocacao:
      mana: 5
      recarga: 45
      dano: 3
      quantidade: 2
      maximo: 2
      segundos: 10
      alcance: 16
    # Invisível (só para quem não é do clan) por invisivel-segundos; as cópias ficam paradas por copias-segundos.
    ilusao:
      mana: 3
      recarga: 25
      invisivel-segundos: 2
      copias: 3
      copias-segundos: 4

# Classe Arqueiro (Foco, rajada, dano por distância, headshot, habilidades, passivas e fraquezas).
# O Foco (0 a 100) aparece na barra de XP.
arqueiro:
  # false: tudo vale só para ARCO. true: a besta também conta.
  incluir-besta: false
  # Dano a mais pela distância entre onde o Arqueiro atirou e onde a flecha acertou.
  distancia:
    # +1% por bloco (0.01)...
    por-bloco: 0.01
    # ...até +30% (0.3).
    maximo: 0.3
  headshot:
    # Flecha na cabeça do alvo: +50% de dano.
    bonus: 0.5
  rajada:
    # Ticks entre uma flecha e a seguinte da rajada (20 ticks = 1 segundo).
    intervalo-ticks: 4
    # Dano das 2 flechas extras (0.7 = 70%). A rajada inteira gasta só 1 flecha.
    dano-extra: 0.7
    # Segundos entre uma rajada e outra (0 = sem recarga).
    recarga-segundos: 10
  foco:
    maximo: 100
    # Fora de combate: +5 de Foco a cada 2 segundos. Em combate só sobe com acertos.
    regen-fora-combate: 5
    regen-intervalo-segundos: 2
    # Foco por flecha que acerta um inimigo.
    por-acerto: 2
  # Habilidades: custo em Foco.
  pulo-duplo:
    custo: 10
    impulso-vertical: 0.8
    impulso-frente: 0.4
  # Shift + F com o arco.
  dash:
    custo: 20
    distancia: 5
    # Sem dano de queda por este tempo depois do Dash.
    protecao-queda-segundos: 2
  # Shift + clique esquerdo com o arco, mirando em um bloco.
  chuva:
    custo: 40
    flechas: 10
    raio: 4
    alcance: 40
    # Tempo do círculo no chão antes das flechas caírem.
    atraso-segundos: 1
  # Clique esquerdo com o arco, mirando em um inimigo. O alvo fica brilhando para todos.
  marca:
    custo: 60
    segundos: 10
    # +15% de dano das flechas do Arqueiro no alvo marcado.
    bonus: 0.15
    alcance: 40
  # Q com o arco arma o próximo tiro; ele só vale se o arco ficar puxado pelo tempo mínimo.
  ultra:
    custo: 100
    ticks-minimos: 40
    multiplicador: 2.5
  # Passivas.
  recuperacao:
    # Chance de a flecha comum não ser gasta (não vale para flechas especiais nem com poção).
    chance: 0.3
  pes-leves:
    # Sem dano de queda até esta altura; acima dela o dano é reduzido por "reducao".
    altura-sem-dano: 6
    reducao: 0.5
  olhos-de-aguia:
    # Agachado com o arco, os inimigos até esta distância aparecem só para o Arqueiro.
    alcance: 20
  # Flechas especiais (vendidas na /loja). Só o Arqueiro atira, só com arco, e sempre gastam a flecha.
  flechas:
    perfurante:
      # Ticks com o arco puxado para a força total (o normal é 20; menos que isto = força proporcional).
      ticks-forca-total: 28
      # Cada alvo atravessado leva isto a menos que o anterior (0.3: 100%, 70%, 49%...).
      queda-por-alvo: 0.3
      # A flecha para quando o dano ficaria abaixo desta fração do original.
      minimo: 0.1
      # Dano a mais em quem usa pelo menos uma peça de armadura.
      bonus-armadura: 0.2
      # Atravessa paredes de até esta espessura (em blocos); depois vira flecha normal.
      espessura-max-parede: 1
    gelo:
      nivel: 2
      segundos: 3
    fumaca:
      raio: 4
      segundos: 5
    corrente:
      segundos: 1
    corda:
      recarga: 3
      alcance: 30
      velocidade: 1.4
      protecao-queda-segundos: 3
  flecha-explosiva:
    # Dano do acerto direto (1.5 = 1.5x).
    multiplicador-dano: 1.5
    # A explosão é só efeito visual/sonoro; o dano é calculado à parte (tipo explosão, causado pelo Arqueiro,
    # então armadura, Proteção e a passiva do Engenheiro valem). Não machuca o Arqueiro nem o clan.
    raio: 3
    # Dano no centro, caindo em linha reta até 0 na borda do raio (6 = 3 corações).
    dano-maximo: 6
    empurrao: 0.6
    # Segundos entre uma Flecha Explosiva e outra, por Arqueiro.
    recarga-segundos: 8
    # Força mínima do arco (0 a 1). Abaixo disso sai uma flecha normal e a Explosiva não é gasta.
    forca-minima: 0.8
  # Fraquezas.
  # Dano a menos nos golpes de espada e machado (0.4 = 40% menos).
  reducao-dano-corpo-a-corpo: 0.4
  # Dano a mais de golpes corpo a corpo recebidos de jogadores e mobs (0.15 = +15%).
  dano-corpo-a-corpo-recebido: 0.15

# Classe Combatente (vida extra, Fúria, Berserker, habilidades e fraquezas). A Fúria aparece na barra de XP.
combatente:
  # Vida a mais (6 = 3 corações: 13 corações no total).
  vida-extra: 6
  # Dano a menos de golpes, projéteis, explosões etc. (0.2 = 20% menos). Não vale para magia, fogo, queda,
  # void, /kill e borda do mundo. Magia e fogo só são reduzidos pela armadura (fórmula do jogo).
  reducao-dano: 0.2
  # Dano a menos de queda (0.2 = 20% menos).
  reducao-queda: 0.2
  # Fraqueza: dano a mais das magias de clique direito do Mago (0.3 = +30%), antes da armadura.
  dano-extra-magia: 0.3
  furia:
    maxima: 100
    por-golpe: 3
    por-dano-recebido: 2
    # Perde isto por segundo depois de ficar fora de combate pelo tempo abaixo.
    queda-fora-combate: 2
    fora-combate-segundos: 5
  # Shift + F. Não desliga: gasta Fúria até acabar e a Fúria não sobe enquanto dura. Sem as reduções de dano.
  berserker:
    furia-minima: 60
    consumo-por-segundo: 10
    # Quanto mais rápido os golpes saem (encurta a imunidade do alvo depois de cada golpe).
    multiplicador-velocidade: 1.5
  # F (sem agachar) com espada ou machado, mirando um inimigo.
  investida:
    custo: 40
    alcance: 8
    # Blocos por tick e força do empurrão no alvo ao chegar.
    velocidade: 1.3
    empurrao: 0.7
    intervalo-segundos: 1
    protecao-queda-segundos: 3
  # Automático no golpe crítico (caindo, depois de pular).
  golpe-pulando:
    custo: 15
    bonus: 0.2
    raio: 3
    dano-area: 0.5
  # Shift + clique direito com espada ou machado.
  provocar:
    custo: 20
    raio: 6
    bonus: 0.15
    segundos: 5
    recarga-segundos: 10
  inabalavel:
    resistencia-empurrao: 0.3
  ultimo-suspiro:
    furia-minima: 80
    # Vida (6 = 3 corações) e absorção (4 = 2 corações dourados) depois de sobreviver ao golpe mortal.
    vida: 6
    absorcao: 4

# Classe Engenheiro (Livros de Estrutura).
engenheiro:
  # Lado da área de construção (blocos) e altura acima do chão de concreto branco.
  area-tamanho: 20
  area-altura: 20
  # Depois de sair de combate, espera isto para marcar área ou salvar (cancelar pode a qualquer hora).
  espera-apos-combate-segundos: 60
  # Espera depois do combate para COLOCAR uma estrutura.
  espera-colocar-apos-combate-segundos: 15
  construcao:
    # A estrutura sobe uma camada (de baixo para cima) a cada tanto de ticks.
    ticks-por-camada: 10
  energia:
    # A energia (barra de XP, 0 a maximo) sobe isto por segundo, sempre.
    por-segundo: 2
    maximo: 100
  # Dano a menos de qualquer explosão (0.5 = 50%).
  reducao-explosao: 0.5
  reparo:
    # Energia gasta para consertar um item por completo (Shift + clique direito).
    custo: 80
  dano:
    # Ajuste do dano final: -0.3 = 30% menos, 0.3 = 30% a mais.
    espada: -0.3
    besta: 0.3
    arco: -0.2
  netherite:
    # Nível da Lentidão para cada quantidade de peças de netherite vestidas.
    lentidao-por-pecas:
      1: 1
      2: 1
      3: 2
      4: 2
  ferro:
    # Chance de choque a cada ação, por peça de ferro vestida (0.15 = 15%, até 60%).
    chance-por-peca: 0.15
    # Dano do choque (6 = 3 corações); ignora armadura.
    dano-choque: 6
  gancho:
    # Recarga entre ganchos (s), distância máxima até o bloco, velocidade da puxada e proteção de queda (s).
    recarga: 3
    distancia-maxima: 30
    velocidade: 1.4
    protecao-queda-segundos: 3
  sentinela:
    # Sentinelas por Engenheiro, raio de detecção (blocos) e intervalo mínimo entre alertas da mesma sentinela (s).
    maximo: 3
    raio: 15
    intervalo-alerta: 30
  planta:
    # Projetos que uma Planta guarda (no máximo 9, o tamanho do menu) e tamanho máximo do nome.
    max-projetos: 9
    nome-maximo: 20
  # Uma construção aberta por mais tempo que isto é cancelada sozinha (os blocos ficam, o chão volta).
  tempo-maximo-minutos: 120
  # Blocos que não podem entrar na estrutura. "*_BED" vale para qualquer material que termina em _BED.
  blocos-proibidos:
    - BEDROCK
    - SPAWNER
    - TRIAL_SPAWNER
    - VAULT
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - JIGSAW
    - BARRIER
    - LIGHT
    - END_PORTAL_FRAME
    - END_PORTAL
    - NETHER_PORTAL
    - END_GATEWAY
    - REINFORCED_DEEPSLATE
    - "*_BED"

# Classe Suporte (vínculo, prender, cura, velocidade, voo e fraqueza).
suporte:
  # Vida máxima a menos (4 = 2 corações: 8 corações no total).
  vida-reduzida: 4
  vinculo:
    # Parte do dano final do aliado que passa para o Suporte (0.35 = 35%).
    porcentagem: 0.35
    # Com a vida do Suporte neste valor ou menos (4 = 2 corações), o vínculo para de dividir dano.
    parar-com-vida: 4
    # O vínculo acaba se os dois ficarem mais longe que isto (blocos).
    distancia-maxima: 20
    # Alcance da mira para vincular (blocos).
    alcance: 10
  prender:
    segundos: 1.5
    alcance: 20
    recarga: 8
    usos: 25
  cura:
    # 6 de vida = 3 corações.
    quantidade: 6
    raio: 6
    recarga: 8
    usos: 8
  pergaminho:
    # 1 = Velocidade I.
    nivel: 1
    segundos: 8
    raio: 8
    recarga: 20
  voo:
    segundos: 5
    recarga: 15
    # Depois do voo, o dano da próxima queda é cancelado por até este tempo.
    protecao-queda-segundos: 10

# Bonecos de teste (/boneco): um inimigo e um aliado que recebem dano, curas e efeitos e mostram tudo em cima deles.
teste:
  # false: desliga o comando e remove os bonecos.
  ativado: true
  # Bater no boneco inimigo coloca o jogador em combate.
  boneco-coloca-em-combate: true
  # Vida com que o boneco aliado nasce e para a qual volta (para testar curas).
  aliado-vida-inicial: 10
  # Segundos com a vida cheia até o aliado voltar à vida inicial.
  aliado-volta-segundos: 3
  # Segundos parado fora do lugar até o boneco voltar sozinho para a posição original.
  volta-posicao-segundos: 3
  # Janela (segundos) do "Dano nos últimos Ns".
  dano-janela-segundos: 10
