# Economia: valores pagos em dinheiro.
economia:
  # Recompensa para quem ganha a kill (inclui kill por combat log).
  recompensa-kill: 100
  # Recompensa para cada jogador que ganha assistência.
  recompensa-assistencia: 30
  # Notas de dinheiro: o dinheiro como item (cai na morte, vai para baús, pode ser roubado).
  notas:
    # Valores das notas (o /money sacar usa as maiores possíveis).
    valores: [1, 10, 100, 1000, 10000]
    # Modelo (item_model) de cada nota.
    modelos:
      '1': minecraft:paper
      '10': minecraft:paper
      '100': minecraft:paper
      '1000': minecraft:paper
      '10000': minecraft:paper
    # Taxa do /money depositar (0.05 = 5%; o dinheiro da taxa some do jogo).
    taxa-deposito: 0.05
    # true: kill, assistência, vendas ao servidor e eventos pagam em notas. false: direto no saldo.
    recompensas-em-notas: true
    # Maior valor de um /money sacar.
    saque-maximo: 10000000
  # Venda de itens ao servidor (/vender). Preço atual = preço base x multiplicador.
  vender:
    # Cada unidade vendida (por qualquer jogador) baixa o multiplicador do item nisto, até o mínimo.
    queda-por-unidade: 0.002
    minimo: 0.3
    # A cada hora o multiplicador recupera esta fração do que falta para 1.0.
    recuperacao-por-hora: 0.05
    # Preço base por unidade (o OP muda no jogo com /vender admin preco e /vender admin remover).
    precos:
      # Minérios e lingotes
      COAL: 2.0
      CHARCOAL: 1.0
      RAW_COPPER: 1.0
      COPPER_INGOT: 1.5
      RAW_IRON: 4.0
      IRON_INGOT: 5.0
      RAW_GOLD: 6.0
      GOLD_INGOT: 8.0
      REDSTONE: 1.0
      LAPIS_LAZULI: 2.0
      QUARTZ: 2.0
      EMERALD: 25.0
      DIAMOND: 60.0
      NETHERITE_SCRAP: 150.0
      NETHERITE_INGOT: 650.0
      # Colheitas
      WHEAT: 0.5
      CARROT: 0.3
      POTATO: 0.3
      BEETROOT: 0.4
      MELON_SLICE: 0.2
      PUMPKIN: 1.0
      SUGAR_CANE: 0.4
      COCOA_BEANS: 0.5
      SWEET_BERRIES: 0.3
      # Madeiras básicas
      OAK_LOG: 1.0
      SPRUCE_LOG: 1.0
      BIRCH_LOG: 1.0
      JUNGLE_LOG: 1.0
      ACACIA_LOG: 1.0
      DARK_OAK_LOG: 1.0
      MANGROVE_LOG: 1.0
      CHERRY_LOG: 1.0
      # Drops de mobs
      ROTTEN_FLESH: 0.2
      BONE: 1.0
      ARROW: 0.5
      FEATHER: 0.5
      STRING: 1.0
      COBWEB: 5.0
      LEATHER: 3.0
      GUNPOWDER: 3.0
      SLIME_BALL: 4.0
      BLAZE_ROD: 12.0
      ENDER_PEARL: 15.0
  # Conserto pago (/reparar): (durabilidade que falta / máxima) x preço do material.
  reparo:
    precos:
      couro: 50
      madeira: 30
      pedra: 60
      ouro: 150
      ferro: 250
      diamante: 800
      netherite: 1500
      outros: 300
    # Item encantado custa isto vezes mais.
    multiplicador-encantado: 1.5

# Clans.
clan:
  # Máximo de membros por clan (incluindo o líder).
  max-membros: 2
  # Núcleo do Clan: só explosões tiram pontos dele.
  nucleo:
    vida: 10
    # Uma explosão a até esta distância (blocos) tira 1 ponto (2 se o clan estiver em dívida).
    raio-explosao: 4
    # Núcleo destruído: o clan fica vulnerável (inimigos quebram, colocam e abrem baús nos claims dos membros).
    vulneravel-minutos: 30
    # Para o jogador que acendeu a TNT que deu o último golpe (em notas).
    recompensa: 5000
    espera-recolocar-horas: 2
    # Regenera 1 ponto a cada tanto de minutos sem ataques.
    regenera-minutos: 10
    # /clan nucleo recolher só depois de tanto tempo sem o Núcleo ser atacado.
    recolher-sem-ataque-minutos: 10
  cofre:
    vida: 6
    # Distância máxima do Núcleo para colocar o Cofre.
    distancia-maxima: 10
    # Juros por dia (aplicados aos poucos a cada hora) e o saldo máximo que rende.
    juros-dia: 0.02
    teto-juros: 100000
    # Parte do saldo que cai no chão em notas quando o Cofre é destruído (e durante a vulnerabilidade).
    perda: 0.3
    perda-vulneravel: 0.5
  poder:
    kill: 1
    nucleo-destruido: 10
    raid-defendido: 2
    nucleo-perdido: 5
  # Manutenção diária de todos os claims dos membros: área x por-bloco x (1 + Poder x peso-poder).
  manutencao:
    horario: "20:00"
    por-bloco: 0.5
    peso-poder: 0.01

# Registro de raids.
raid:
  # O raid acaba depois de tanto tempo sem explosões ou ataques.
  fim-apos-minutos: 5
  # Aviso "BASE SOB ATAQUE" no máximo a cada tanto de minutos.
  aviso-a-cada-minutos: 2
  # TNT sem dono conhecido: inimigos a até esta distância contam como atacantes.
  raio-atacantes: 64

# Eventos.
eventos:
  airdrop:
    # Minutos entre um airdrop e outro (sorteado entre os dois) e jogadores online necessários.
    intervalo-min: 90
    intervalo-max: 150
    minimo-jogadores: 4
    # Minutos até o baú sumir depois de cair.
    duracao: 10
    # Distância mínima de qualquer claim e raio máximo a partir do centro da borda do mundo.
    distancia-claims: 50
    raio-maximo: 3000
    # Quantos itens o baú sorteia da tabela (/airdrop admin editar).
    itens-min: 4
    itens-max: 8
    contagem-segundos: 60
  recompensa:
    # Valor da recompensa de cada nível de contrato (I a V).
    valores: [1000, 3000, 8000, 20000, 50000]
    # A recompensa expira depois deste tempo com o alvo online (offline o tempo pausa).
    duracao-horas: 2
    modelo-contrato: minecraft:map

# XP: o servidor não tem XP. A barra de XP mostra o recurso da classe (ex: a mana do Mago).
xp:
  # true: nenhuma fonte dá XP nem orbes e o XP real de todos fica em 0 (a barra das classes só funciona assim).
  desativado: true
  # Mesa de encantamento e bigorna ficam bloqueadas até o encantamento novo existir.
  bloquear-mesa-encantamento: true
  bloquear-bigorna: true
  # true: desliga a Locator Bar (barra de pontos/direção no lugar da barra de XP) em todos os mundos. Só existe na 1.21.6+.
  desativar-locator-bar: true

# Combate: comandos que não podem ser usados enquanto o jogador está em combate (sem a barra).
combate:
  comandos-bloqueados:
    - grimorio
    - reparar

# PvP estilo 1.8.
pvp:
  # Tira a recarga de ataque: todo golpe sai com dano cheio, mesmo clicando rápido.
  sem-recarga-de-ataque: true
  # Remove o ataque em área (sweep) da espada.
  remover-ataque-em-area: true
  # Machado com o dano da 1.8 (madeira 3, ouro 3, pedra 4, ferro 5, diamante 6, netherite 7).
  dano-machado-1-8: true
  # Impede de levantar o escudo.
  desativar-escudo: false

# Login (o servidor roda em modo offline).
login:
  # Tempo para fazer login/registro antes de ser expulso.
  tempo-para-logar-segundos: 60
  # Senhas erradas seguidas até ser expulso.
  tentativas-maximas: 5
  # Sessão: quem sai e volta com o MESMO IP dentro do prazo entra já logado.
  sessao:
    ativada: false
    minutos: 10

# Classe Mago (staffs, míssil, mana, passivas e fraqueza).
mago:
  # true: as staffs usam o item_model "mineplug:staff_<tipo>" (resource pack). false: aparência normal.
  textura-personalizada: false
  mana-maxima: 10
  # true: mostra a mana também na sidebar (por padrão ela só aparece na barra de XP).
  mana-na-sidebar: false
  mana:
    # Segundos para recuperar 1 ponto de mana.
    regen-fora-combate: 2
    regen-em-combate: 6
    # Mana ganha ao matar um jogador / ao dar assistência.
    por-kill: 3
    por-assistencia: 1
  # Míssil Arcano (clique esquerdo com a staff): sem mana, sem recarga.
  missil:
    intervalo-segundos: 0.6
    mana-por-acerto: 1
    dano: 2.5
    alcance: 30
    # Blocos por tick.
    velocidade: 2
  # Fração do dano perdida com espada, machado, maça, tridente, lança e flechas de arco/besta (0.6 = 60%).
  penalidade-arma: 0.6
  # Fração a mais de dano que o Mago leva de golpes e projéteis (0.15 = +15%).
  dano-extra-recebido-porcentagem: 0.15
  # Poder Arcano: cada magia (não o míssil) dá 1 acúmulo; cada acúmulo aumenta o dano das magias e do míssil.
  poder-arcano:
    bonus-por-acumulo: 0.1
    maximo: 3
    segundos: 5
  # Escudo de Mana: parte do dano levado é paga com mana.
  escudo-mana:
    porcentagem: 0.2
    # Pontos de dano absorvidos por 1 de mana.
    dano-por-mana: 2
  # Grimório: quantas magias podem ficar equipadas (1 a 9).
  grimorio:
    max-equipadas: 4
  # Combos entre magias. Cada um se liga/desliga com "ativado".
  combos:
    # Quanto tempo o alvo fica marcado pela Staff de Gelo / de Vento.
    gelo-marca-segundos: 5
    vento-marca-segundos: 3
    # Gelo -> Fogo: o Fogo causa mais dano no alvo congelado e tira a lentidão e a fadiga dele.
    choque-termico:
      ativado: true
      multiplicador-dano: 2
    # Gelo -> Raio: se o primeiro alvo está congelado, o raio pula mais vezes e mais longe.
    condutor:
      ativado: true
      saltos: 4
      distancia-salto: 7
    # Vento -> Fogo: alvos empurrados queimam por mais tempo e a explosão do Fogo cresce.
    tempestade-fogo:
      ativado: true
      fogo-segundos: 6
      raio: 4
    # Teleporte -> qualquer magia: a próxima magia dentro do prazo não gasta mana (a recarga continua).
    passo-arcano:
      ativado: true
      segundos: 4
  # dano = antes da Proteção. recarga e durações em segundos, raio/alcance em blocos.
  staffs:
    fogo:
      mana: 2
      recarga: 5
      dano: 4
      raio: 3
      alcance: 30
      fogo-segundos: 3
      cegueira-segundos: 2
    gelo:
      mana: 2
      recarga: 10
      dano: 2
      raio: 2
      alcance: 30
      efeito-segundos: 5
    raio:
      mana: 3
      recarga: 5
      dano: 6
      alcance: 25
      saltos: 2
      distancia-salto: 5
    teleporte:
      mana: 5
      recarga: 30
      alcance: 30
      carga-segundos: 3
      distancia-acompanhantes: 3
      max-acompanhantes: 2
    vento:
      mana: 2
      recarga: 20
      dano: 3
      raio: 5
      forca-horizontal: 1.5
      forca-vertical: 0.5
    # Nuvem de veneno onde o projétil acerta. nivel-veneno 2 = Veneno II, renovado enquanto o alvo está dentro.
    veneno:
      mana: 3
      recarga: 12
      raio: 3
      alcance: 30
      nuvem-segundos: 4
      efeito-segundos: 3
      nivel-veneno: 2
    # Marca o bloco mirado, avisa com um círculo vermelho e então cai. Não quebra blocos nem põe fogo.
    meteoro:
      mana: 6
      recarga: 60
      dano: 10
      raio: 4
      alcance: 30
      aviso-segundos: 1.5
      lentidao-segundos: 3
    # Dano no alvo da mira (sem atravessar parede); o Mago cura cura-porcentagem do dano causado.
    sangue:
      mana: 3
      recarga: 10
      dano: 4
      alcance: 15
      cura-porcentagem: 0.5
    # Puxa para o Mago os inimigos no raio (só os que ele enxerga). forca = velocidade máxima da puxada.
    gravidade:
      mana: 3
      recarga: 15
      dano: 2
      raio: 8
      forca: 1.2
    # Área no bloco mirado: inimigos ficam com Lentidão (nivel-lentidao 4 = Lentidão IV) e sem pular.
    tempo:
      mana: 4
      recarga: 25
      raio: 5
      alcance: 30
      duracao-segundos: 3
      nivel-lentidao: 4
    # Absorção em vida (8 = 4 corações amarelos) por "segundos".
    escudo:
      mana: 4
      recarga: 30
      absorcao: 8
      segundos: 10
    # Clarão no raio: cegueira nos inimigos; jogador inimigo invisível (ou em Ilusão) é revelado e brilha.
    luz:
      mana: 2
      recarga: 20
      raio: 6
      cegueira-segundos: 3
      brilho-segundos: 5
    # Espíritos (Vex). dano = por golpe de cada espírito (conta como dano do Mago). alcance = distância em que
    # procuram inimigos em volta do Mago. maximo = espíritos vivos ao mesmo tempo por Mago.
    invocacao:
      mana: 5
      recarga: 45
      dano: 3
      quantidade: 2
      maximo: 2
      segundos: 10
      alcance: 16
    # Invisível (só para quem não é do clan) por invisivel-segundos; as cópias ficam paradas por copias-segundos.
    ilusao:
      mana: 3
      recarga: 25
      invisivel-segundos: 2
      copias: 3
      copias-segundos: 4

# Classe Arqueiro (Foco, rajada, dano por distância, headshot, habilidades, passivas e fraquezas).
# O Foco (0 a 100) aparece na barra de XP.
arqueiro:
  # false: tudo vale só para ARCO. true: a besta também conta.
  incluir-besta: false
  # Dano a mais pela distância entre onde o Arqueiro atirou e onde a flecha acertou.
  distancia:
    # +1% por bloco (0.01)...
    por-bloco: 0.01
    # ...até +30% (0.3).
    maximo: 0.3
  headshot:
    # Flecha na cabeça do alvo: +50% de dano.
    bonus: 0.5
  rajada:
    # Ticks entre uma flecha e a seguinte da rajada (20 ticks = 1 segundo).
    intervalo-ticks: 4
    # Dano das 2 flechas extras (0.7 = 70%). A rajada inteira gasta só 1 flecha.
    dano-extra: 0.7
    # Segundos entre uma rajada e outra (0 = sem recarga).
    recarga-segundos: 10
  foco:
    maximo: 100
    # Fora de combate: +5 de Foco a cada 2 segundos. Em combate só sobe com acertos.
    regen-fora-combate: 5
    regen-intervalo-segundos: 2
    # Foco por flecha que acerta um inimigo.
    por-acerto: 2
  # Habilidades: custo em Foco.
  pulo-duplo:
    custo: 10
    impulso-vertical: 0.8
    impulso-frente: 0.4
  # Shift + F com o arco.
  dash:
    custo: 20
    distancia: 5
    # Sem dano de queda por este tempo depois do Dash.
    protecao-queda-segundos: 2
  # Shift + clique esquerdo com o arco, mirando em um bloco.
  # 5 ondas de 1.5 de dano em quem estiver na área (acerto garantido, a armadura reduz).
  chuva:
    custo: 40
    raio: 4
    alcance: 40
    # Tempo do círculo no chão antes da chuva começar.
    atraso-segundos: 1
    # A chuva dura ondas x intervalo-ticks (5 x 8 = 40 ticks = 2 segundos).
    ondas: 5
    intervalo-ticks: 8
    # Dano de cada onda em cada inimigo dentro da área (vale a Marca do Caçador; sem headshot, distância nem Ultra Foco).
    dano-por-onda: 1.5
    # Flechas de enfeite espalhadas na área (sem dano, somem ao tocar o chão).
    flechas-decorativas: 10
  # Clique esquerdo com o arco, mirando em um inimigo. O alvo fica brilhando para todos.
  marca:
    custo: 60
    segundos: 10
    # +15% de dano das flechas do Arqueiro no alvo marcado.
    bonus: 0.15
    alcance: 40
  # Q com o arco arma o próximo tiro; ele só vale se o arco ficar puxado pelo tempo mínimo.
  ultra:
    custo: 100
    ticks-minimos: 40
    multiplicador: 2.5
  # Passivas.
  recuperacao:
    # Chance de a flecha comum não ser gasta (não vale para flechas especiais nem com poção).
    chance: 0.3
  pes-leves:
    # Sem dano de queda até esta altura; acima dela o dano é reduzido por "reducao".
    altura-sem-dano: 6
    reducao: 0.5
  olhos-de-aguia:
    # Agachado com o arco, os inimigos até esta distância aparecem só para o Arqueiro.
    alcance: 20
  # Flechas especiais (vendidas na /loja). Só o Arqueiro atira, só com arco, e sempre gastam a flecha.
  flechas:
    perfurante:
      # Ticks com o arco puxado para a força total (o normal é 20; menos que isto = força proporcional).
      ticks-forca-total: 28
      # Cada alvo atravessado leva isto a menos que o anterior (0.3: 100%, 70%, 49%...).
      queda-por-alvo: 0.3
      # A flecha para quando o dano ficaria abaixo desta fração do original.
      minimo: 0.1
      # Dano a mais em quem usa pelo menos uma peça de armadura.
      bonus-armadura: 0.2
      # Atravessa paredes de até esta espessura (em blocos); depois vira flecha normal.
      espessura-max-parede: 1
    gelo:
      nivel: 2
      segundos: 3
    fumaca:
      raio: 4
      segundos: 5
    corrente:
      segundos: 1
    corda:
      recarga: 3
      alcance: 30
      velocidade: 1.4
      protecao-queda-segundos: 3
  flecha-explosiva:
    # Dano do acerto direto (1.5 = 1.5x).
    multiplicador-dano: 1.5
    # A explosão é só efeito visual/sonoro; o dano é calculado à parte (tipo explosão, causado pelo Arqueiro,
    # então armadura, Proteção e a passiva do Engenheiro valem). Não machuca o Arqueiro nem o clan.
    raio: 3
    # Dano no centro, caindo em linha reta até 0 na borda do raio (6 = 3 corações).
    dano-maximo: 6
    empurrao: 0.6
    # Segundos entre uma Flecha Explosiva e outra, por Arqueiro.
    recarga-segundos: 8
    # Força mínima do arco (0 a 1). Abaixo disso sai uma flecha normal e a Explosiva não é gasta.
    forca-minima: 0.8
  # Fraquezas.
  # Dano a menos nos golpes de espada e machado (0.4 = 40% menos).
  reducao-dano-corpo-a-corpo: 0.4
  # Dano a mais de golpes corpo a corpo recebidos de jogadores e mobs (0.15 = +15%).
  dano-corpo-a-corpo-recebido: 0.15

# Classe Combatente (vida extra, Fúria, Berserker, habilidades e fraquezas). A Fúria aparece na barra de XP.
combatente:
  # Vida a mais (6 = 3 corações: 13 corações no total).
  vida-extra: 6
  # Dano a menos de golpes, projéteis, explosões etc. (0.2 = 20% menos). Não vale para magia, fogo, queda,
  # void, /kill e borda do mundo. Magia e fogo só são reduzidos pela armadura (fórmula do jogo).
  reducao-dano: 0.2
  # Dano a menos de queda (0.2 = 20% menos).
  reducao-queda: 0.2
  # Fraqueza: dano a mais das magias de clique direito do Mago (0.3 = +30%), antes da armadura.
  dano-extra-magia: 0.3
  furia:
    maxima: 100
    por-golpe: 3
    por-dano-recebido: 2
    # Perde isto por segundo depois de ficar fora de combate pelo tempo abaixo.
    queda-fora-combate: 2
    fora-combate-segundos: 5
  # Shift + F. Não desliga: gasta Fúria até acabar e a Fúria não sobe enquanto dura. Sem as reduções de dano.
  berserker:
    furia-minima: 60
    consumo-por-segundo: 10
    # Quanto mais rápido os golpes saem (encurta a imunidade do alvo depois de cada golpe).
    multiplicador-velocidade: 1.5
  # F (sem agachar) com espada ou machado, mirando um inimigo.
  investida:
    custo: 40
    alcance: 8
    # Blocos por tick e força do empurrão no alvo ao chegar.
    velocidade: 1.3
    empurrao: 0.7
    intervalo-segundos: 1
    protecao-queda-segundos: 3
  # Automático no golpe crítico (caindo, depois de pular).
  golpe-pulando:
    custo: 15
    bonus: 0.2
    raio: 3
    dano-area: 0.5
  # Shift + clique direito com espada ou machado.
  provocar:
    custo: 20
    raio: 6
    bonus: 0.15
    segundos: 5
    recarga-segundos: 10
  inabalavel:
    resistencia-empurrao: 0.3
  ultimo-suspiro:
    furia-minima: 80
    # Vida (6 = 3 corações) e absorção (4 = 2 corações dourados) depois de sobreviver ao golpe mortal.
    vida: 6
    absorcao: 4

# Classe Engenheiro (Livros de Estrutura).
engenheiro:
  # Lado da área de construção (blocos) e altura acima do chão de concreto branco.
  area-tamanho: 20
  area-altura: 20
  # Depois de sair de combate, espera isto para marcar área ou salvar (cancelar pode a qualquer hora).
  espera-apos-combate-segundos: 60
  # Espera depois do combate para COLOCAR uma estrutura.
  espera-colocar-apos-combate-segundos: 15
  construcao:
    # A estrutura sobe uma camada (de baixo para cima) a cada tanto de ticks.
    ticks-por-camada: 10
  energia:
    # A energia (barra de XP, 0 a maximo) sobe isto por segundo, sempre.
    por-segundo: 2
    maximo: 100
  # Dano a menos de qualquer explosão (0.5 = 50%).
  reducao-explosao: 0.5
  dano:
    # Ajuste do dano final: -0.3 = 30% menos, 0.3 = 30% a mais.
    espada: -0.3
    besta: 0.3
    arco: -0.2
  netherite:
    # Nível da Lentidão para cada quantidade de peças de netherite vestidas.
    lentidao-por-pecas:
      1: 1
      2: 1
      3: 2
      4: 2
  ferro:
    # Chance de choque a cada ação, por peça de ferro vestida (0.15 = 15%, até 60%).
    chance-por-peca: 0.15
    # Dano do choque (6 = 3 corações); ignora armadura.
    dano-choque: 6
  gancho:
    # Recarga entre ganchos (s), distância máxima até o bloco, velocidade da puxada e proteção de queda (s).
    recarga: 3
    distancia-maxima: 30
    velocidade: 1.4
    protecao-queda-segundos: 3
  sentinela:
    # Sentinelas por Engenheiro, raio de detecção (blocos) e intervalo mínimo entre alertas da mesma sentinela (s).
    maximo: 3
    raio: 15
    intervalo-alerta: 30
  golem:
    # Golem de Cobre (item vendido na /loja): energia para invocar, máximo ao mesmo tempo, vida, dano por golpe e
    # segundos entre golpes. Clique direito no golem cura "reparo-vida" gastando "reparo-custo" de energia.
    custo-energia: 30
    maximo: 3
    vida: 10
    dano: 6
    intervalo-segundos: 1.0
    reparo-vida: 5
    reparo-custo: 15
    # Fração do empurrão normal dos golpes do golem (0.4 = 40%).
    empurrao: 0.4
  golem-ferro:
    # Shift + F com 3 Golems de Cobre vivos os junta em 1 Golem de Ferro.
    custo-energia: 60
    vida: 30
    dano: 8
    intervalo-segundos: 1.2
    empurrao: 0.4
  planta:
    # Projetos que uma Planta guarda (no máximo 9, o tamanho do menu) e tamanho máximo do nome.
    max-projetos: 9
    nome-maximo: 20
  # Uma construção aberta por mais tempo que isto é cancelada sozinha (os blocos ficam, o chão volta).
  tempo-maximo-minutos: 120
  # Blocos que não podem entrar na estrutura. "*_BED" vale para qualquer material que termina em _BED.
  blocos-proibidos:
    - BEDROCK
    - SPAWNER
    - TRIAL_SPAWNER
    - VAULT
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - JIGSAW
    - BARRIER
    - LIGHT
    - END_PORTAL_FRAME
    - END_PORTAL
    - NETHER_PORTAL
    - END_GATEWAY
    - REINFORCED_DEEPSLATE
    - "*_BED"

# Classe Suporte (Harmonia, vínculo, prender, cura, velocidade, voo, Troca Equivalente, Elo Drenante...).
# "custo" = Harmonia gasta; "recarga" em segundos.
suporte:
  # Vida máxima a mais (16 = 8 corações: 18 corações no total).
  vida-extra: 16
  # Fraqueza: dano a menos com espada, machado, maça, tridente, lança e projéteis de arco/besta/tridente (0.4 = 40%).
  penalidade-arma: 0.4
  # Harmonia (barra de XP, de 0 a maxima). Começa em 0 ao entrar e ao renascer.
  harmonia:
    maxima: 100
    # Por ponto de vida curado em aliados ou em si mesmo (0.5 = +1 a cada 2 de vida).
    por-cura: 0.5
    # Por ponto de dano que o vínculo tirou do aliado (0.5 = +1 a cada 2 de dano).
    por-vinculo: 0.5
    # Passiva Recompensa: por assistência (além do dinheiro).
    por-assistencia: 10
    # +regen a cada regen-intervalo-segundos.
    regen: 1
    regen-intervalo-segundos: 2
  vinculo:
    # Parte do dano final do aliado que passa para o Suporte (0.35 = 35%).
    porcentagem: 0.35
    # Dano a menos do aliado vinculado, aplicado antes da divisão (0.1 = 10%).
    resistencia: 0.1
    # Parte das autocuras do Suporte que o aliado vinculado também recebe (0.5 = metade).
    cura-compartilhada: 0.5
    # Com a vida do Suporte neste valor ou menos (4 = 2 corações), o vínculo para de dividir dano.
    parar-com-vida: 4
    # O vínculo acaba se os dois ficarem mais longe que isto (blocos).
    distancia-maxima: 20
    # Alcance da mira para vincular (blocos).
    alcance: 10
  prender:
    segundos: 1.5
    alcance: 20
    recarga: 8
    custo: 25
  cura:
    # 6 de vida = 3 corações.
    quantidade: 6
    raio: 6
    recarga: 8
    custo: 30
  pergaminho:
    # 1 = Velocidade I.
    nivel: 1
    segundos: 8
    raio: 8
    recarga: 20
    custo: 20
  voo:
    segundos: 5
    recarga: 15
    custo: 15
    # Depois do voo, o dano da próxima queda é cancelado por até este tempo.
    protecao-queda-segundos: 10
    # Velocidade de voo durante o voo da Pena (o padrão do jogo é 0.1). Volta à de antes quando o voo acaba.
    velocidade: 0.04
    # Velocidade horizontal máxima voando (blocos por tick), inclusive correndo.
    velocidade-maxima: 0.6
    # Quantos blocos acima do ponto onde começou a voar o Suporte pode subir.
    altura-maxima: 8
  # Troca Equivalente (Shift + clique direito com o Núcleo liga/desliga). Não gasta Harmonia.
  troca:
    # Vida do aliado salvo (8 = 4 corações).
    vida-aliado: 8
    # Vida máxima do Suporte durante a penalidade (6 = 3 corações) e por quanto tempo.
    vida-maxima: 6
    segundos: 60
    recarga-segundos: 180
  # Elo Drenante (Shift + clique esquerdo com o Núcleo): dano do Suporte vira cura no vinculado.
  elo:
    segundos: 5
    # Fração do dano final que vira cura (1.0 = 100%).
    porcentagem: 1.0
    custo: 35
    recarga: 20
  # Troca de Lugar (Shift + clique esquerdo com a Pena) com o aliado vinculado.
  troca-lugar:
    distancia: 30
    custo: 20
    recarga: 15
    protecao-queda-segundos: 3
  # Passiva Socorrista: aliado a até "raio" blocos abaixo de "vida" (0.3 = 30% da vida máxima) dá Velocidade.
  socorrista:
    raio: 15
    vida: 0.3
    segundos: 3
    # 2 = Velocidade II.
    nivel: 2
    recarga: 10
  # Escudo Sagrado (item; clique direito no aliado na mira, ou no ar para você): absorção (8 = 4 corações).
  escudo:
    absorcao: 8
    segundos: 6
    alcance: 15
    custo: 35
    recarga: 12
  # Purificar (Shift + clique esquerdo com o Coração): tira efeitos ruins seus e dos aliados no raio.
  purificar:
    raio: 8
    custo: 30
    recarga: 10
  # Totem de Cura (item de uso único, vendido na /loja; clique direito em um bloco): Regeneração (nivel 2 = II) aos
  # aliados no raio até ser destruído pelos inimigos ("vida"). Sem Harmonia, sem recarga, sem tempo limite.
  # "maximo" = totens ativos por Suporte. Só onde o Suporte pode construir.
  totem:
    vida: 50
    nivel: 2
    raio: 6
    maximo: 1
  # Silêncio (Shift + clique esquerdo com a Estrela): o inimigo na mira não usa habilidades de classe.
  silencio:
    segundos: 10
    alcance: 20
    custo: 40
    recarga: 20
  # Maldição (Shift + clique esquerdo com o Pergaminho): o inimigo na mira causa menos dano (0.2 = 20%).
  maldicao:
    reducao: 0.2
    segundos: 5
    alcance: 20
    custo: 25
    recarga: 15

# Bonecos de teste (/boneco): um inimigo e um aliado que recebem dano, curas e efeitos e mostram tudo em cima deles.
teste:
  # false: desliga o comando e remove os bonecos.
  ativado: true
  # Bater no boneco inimigo coloca o jogador em combate.
  boneco-coloca-em-combate: true
  # Vida com que o boneco aliado nasce e para a qual volta (para testar curas).
  aliado-vida-inicial: 10
  # Segundos com a vida cheia até o aliado voltar à vida inicial.
  aliado-volta-segundos: 3
  # Segundos parado fora do lugar até o boneco voltar sozinho para a posição original.
  volta-posicao-segundos: 3
  # Janela (segundos) do "Dano nos últimos Ns".
  dano-janela-segundos: 10
