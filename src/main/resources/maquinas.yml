# Máquinas do clan. O jeito certo de mudar é pelo painel dentro do jogo (/maquinas admin): cada mudança é salva
# aqui na hora e vale sem reiniciar. Se editar este arquivo à mão, use "Recarregar maquinas.yml" no painel.
# Os dados das máquinas colocadas no mundo ficam em maquinas-dados.yml.

geral:
  # Quando as máquinas funcionam: SEMPRE, CLAN_ONLINE (algum membro online) ou MEMBRO_PERTO (membro a até o raio).
  condicao: CLAN_ONLINE
  raio-membro-perto: 32
  # true = só o líder do clan compra máquinas no /maquinas.
  apenas-lider-compra: true
  # Multiplicador de velocidade de todas as máquinas (1.0 = normal).
  velocidade-global: 1.0
  # Fora de raid, a máquina recupera 1 de vida a cada X minutos (0 = desligado).
  regeneracao-minutos: 10

# Modo teste do admin: as máquinas ficam "multiplicador" vezes mais rápidas e o holograma mostra [MODO TESTE].
modo-teste:
  ativo: false
  multiplicador: 100

# Itens aceitos como combustível (em qualquer máquina) e quantas unidades cada um vale.
combustiveis:
  COAL: 1
  CHARCOAL: 1
  COAL_BLOCK: 9

engenheiro:
  # Máquinas do clan ficam X mais rápidas com um Engenheiro do clan a até "raio" blocos (não acumula).
  bonus-velocidade: 0.10
  raio: 10
  # Shift + clique direito do Engenheiro do clan na máquina: recupera esta vida gastando esta energia.
  reparo-vida: 1
  reparo-energia: 20

upgrades:
  # Com upgrades, o ciclo nunca fica abaixo desta fração do ciclo base (0.2 = 20%).
  ciclo-minimo: 0.2
  # Com upgrades, o combustível (e o custo do Cofre) por ciclo nunca fica abaixo desta fração do base.
  combustivel-minimo: 0.2
  # Venda automática: fração do valor que fica com o servidor (0.20 = 20% de taxa).
  venda-automatica-taxa: 0.20
  # Custo (do Cofre do clan) por nível do resultado ao juntar dois upgrades (0 = grátis).
  custo-juntar: 0
  tipos:
    ESTOQUE:
      nivel-maximo: 5
      # +armazém por nível
      valor-por-nivel: 128
      # +combustível máximo por nível
      combustivel-por-nivel: 16
    VELOCIDADE:
      nivel-maximo: 5
      # -fração do tempo do ciclo por nível
      valor-por-nivel: 0.10
    EFICIENCIA:
      nivel-maximo: 5
      # -fração do combustível (e do custo do Cofre) por nível
      valor-por-nivel: 0.10
    FORTUNA:
      nivel-maximo: 5
      # +chance de produzir em dobro no ciclo, por nível
      valor-por-nivel: 0.05
    SORTE:
      nivel-maximo: 5
      # +fração no peso dos itens raros, por nível
      valor-por-nivel: 0.25
    BLINDAGEM:
      nivel-maximo: 5
      # +vida da máquina por nível
      valor-por-nivel: 1
    COLETA_AUTOMATICA:
      nivel-maximo: 1
      valor-por-nivel: 1
    VENDA_AUTOMATICA:
      nivel-maximo: 1
      valor-por-nivel: 1

