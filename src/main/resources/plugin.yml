name: MinePlug
version: '${project.version}'
main: br.com.murilo.muriloplug.MinePlug
api-version: '26.3'

commands:
  claim:
    description: Pré-visualiza, confirma (com nome), remove, lista e compartilha (trust) os seus claims (até 9, de até 50x50 blocos).
    usage: /claim <tamanho> | <nome> | cancelar | remover <nome> | trust <jogador> <claim> | untrust <jogador> <claim> | info
  meuclaim:
    description: Abre o menu com os seus claims.
    usage: /meuclaim
  sethome:
    description: Salva a sua posição atual como uma home (até 5).
    usage: /sethome <nome>
  home:
    description: Teleporta para uma home (com contagem de 5s) ou abre o menu das suas homes.
    usage: /home [nome]
  delhome:
    description: Apaga uma home, escolhendo no menu e confirmando em um segundo menu.
    usage: /delhome [nome]

  kda:
    description: Mostra o seu K/D/A e KDA, ou o de outro jogador.
    usage: /kda [jogador]
  tpa:
    description: Pede para ir até um jogador, ou aceita, nega, cancela e bloqueia pedidos de TPA.
    usage: /tpa <jogador> | aceitar [jogador] | negar [jogador] | cancelar | bloquear
  tpaqui:
    description: Pede para um jogador vir até você.
    usage: /tpaqui <jogador>
  money:
    description: Mostra o seu saldo (e as notas no inventário), envia dinheiro, saca em notas ou deposita notas (administradores também podem dar, tirar e definir saldo).
    usage: /money [jogador] | pay <jogador> <valor> | sacar <valor> | depositar [mao] | admin <dar|tirar|definir> <jogador> <valor>
  loja:
    description: Abre a loja do servidor (administradores também podem gerenciar os itens).
    usage: /loja [admin]
  mercado:
    description: Abre o mercado entre jogadores (comprar, vender e gerenciar seus anúncios pelo menu).
    usage: /mercado
  vender:
    description: Vende itens ao servidor (baú de venda, item da mão) e mostra os preços atuais.
    usage: /vender | mao | precos | admin preco <valor> | admin remover
  reparar:
    description: Conserta o item da mão (ou tudo o que está vestido) pagando com dinheiro.
    usage: /reparar [tudo]
  maquinas:
    description: Abre o menu de máquinas (em breve).
    usage: /maquinas
  airdrop:
    description: Mostra o Airdrop atual; administradores iniciam, editam a tabela e pegam Contratos de Recompensa.
    usage: /airdrop [iniciar | admin editar | admin contrato <nível> <quantidade>]
  clan:
    description: Cria e gerencia clans (convites, membros, liderança e chat do clan).
    usage: /clan [criar|convidar|aceitar|negar|sair|expulsar|lider|desfazer|chat|info|nucleo [recolher]|top|pagar|manutencao|raids|admin <juros|manutencao|item <nucleo|cofre>>]
  classe:
    description: Abre o menu de classes (escolher) ou troca a sua classe atual.
    usage: /classe [trocar] | admin staff <tipo> | admin mana <definir|dar> <jogador> <valor> | admin manamaxima <definir|resetar> <jogador> [valor] | admin flecha <explosiva|perfurante|gelo|fumaca|corrente|corda> <quantidade> | admin flecha <quantidade> [gancho] | admin sentinela <quantidade> | admin golem <quantidade> | admin totem <quantidade> | admin livro <quantidade> | admin planta
  grimorio:
    description: Abre o Grimório do Mago (aprender magias consumindo staffs e equipar até 4 magias).
    usage: /grimorio
  kit:
    description: Administração de kits (pega todos os itens de uma classe pelo menu).
    usage: /kit admin classe
  c:
    description: Chat do clan (só os membros online do seu clan recebem).
    usage: /c <mensagem>
  register:
    description: Registra a sua conta no servidor com uma senha.
    usage: /register <senha> <senha>
    aliases: [registrar]
  login:
    description: Entra na sua conta.
    usage: /login <senha>
    aliases: [logar]
  trocarsenha:
    description: Troca a senha da sua conta.
    usage: /trocarsenha <senha antiga> <senha nova>
  auth:
    description: Administração do login (resetar o registro de um jogador).
    usage: /auth admin resetar <jogador>
  teste:
    description: Liga ou desliga o Modo Teste (recursos infinitos, sem recargas e sem gastar flechas) para você ou para outro jogador.
    usage: /teste [jogador|lista]
  boneco:
    description: Cria e controla os bonecos de teste (um inimigo e um aliado) que recebem dano, curas e efeitos.
    usage: /boneco <inimigo|aliado|remover|removertodos|vida <valor>|dano <valor>|armadura <tipo>|resetar>
  visao:
    description: Liga ou desliga a visão noturna do Suporte.
    usage: /visao
  troca:
    description: Liga ou desliga a Troca Equivalente do Suporte.
    usage: /troca

permissions:
  mineplug.claim.bypass:
    description: Permite construir em claims de outros jogadores.
    default: op
  mineplug.money.admin:
    description: Permite usar /money admin (dar, tirar e definir saldo).
    default: op
  mineplug.teste:
    description: Permite usar /teste (Modo Teste).
    default: op
  mineplug.boneco:
    description: Permite usar /boneco (bonecos de teste).
    default: op
  mineplug.loja.admin:
    description: Permite gerenciar os itens da loja (/loja admin).
    default: op
  mineplug.classe.admin:
    description: Permite pegar as staffs do Mago as Flechas Especiais do Arqueiro e os Livros de Estrutura do Engenheiro (/classe admin).
    default: op
  mineplug.kit.admin:
    description: Permite usar /kit admin classe (pegar o kit de itens de uma classe).
    default: op
  mineplug.auth.admin:
    description: Permite usar /auth admin resetar.
    default: op
  mineplug.vender.admin:
    description: Permite mudar a tabela de venda ao servidor (/vender admin preco e remover).
    default: op
  mineplug.clan.admin:
    description: Permite usar /clan admin (juros, manutenção e itens do Núcleo/Cofre).
    default: op
  mineplug.airdrop.admin:
    description: Permite iniciar o Airdrop, editar a tabela de itens e pegar Contratos de Recompensa (/airdrop).
    default: op
